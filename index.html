<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreWave</title>
    <!-- Google Fonts Link Start -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Google Fonts Link End -->
    <!-- Font Awesome Link Start -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- Font Awesome Link End -->
    <!-- Bootstrap CSS Link Start -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <!-- Bootstrap CSS Link End -->
    <!-- CSS Style Link Start -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- CSS Style Link End -->
  </head>
  <body>
    <!-- ====== Navbar Section Start ====== -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.png" alt="logo.png" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Portfolio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Testimonial</a>
            </li>
          </ul>
        </div>
        <div class="nav_actions">
          <button class="btn btn-outline-success" type="submit">
            Register
          </button>
        </div>
      </div>
    </nav>
    <!-- ====== Navbar Section End ====== -->

    <!-- ====== Banner Section Start ====== -->
    <section id="banner">
      <div class="container">
        <div class="row">
          <div class="col-lg-6">
            <div class="banner_Content">
              <h1>
                <span>Empower Your Team</span>
                With CoreWave's
              </h1>
              <p>
                Boost Productivity and Wellness in Your Organization with
                CoreWave's Advanced Tools and Techniques
              </p>
              <div class="banner_actions">
                <a href="#" class="btn">Explore More</a>
                <a href="#" class="banner_btn"
                  ><i class="fa-solid fa-play"></i> Watch Video</a
                >
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="banner_img_wrapper">
              <img
                src="./images/banner.png"
                alt="CoreWave Banner"
                class="img-fluid"
              />
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- ====== Banner Section End ====== -->

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
